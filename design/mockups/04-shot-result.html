<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ball Knower — Shot result (ball flight) (mockup)</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&amp;family=Graduate&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2B632}a:hover{color:#FFD36B}
@keyframes bkArc{0%{stroke-dashoffset:1}55%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
.bk-arc{stroke-dasharray:1;stroke-dashoffset:1;animation:bkArc 2.6s ease-out infinite}
</style>
<style>body{display:flex;justify-content:center;background:#0E2618;min-height:100vh}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 24px 28px; display: flex; flex-direction: column; gap: 20px; background: repeating-linear-gradient(90deg, #1A4530 0 28px, #173D2A 28px 56px); color: #F3EEDF; font-family: 'Archivo', sans-serif">
  <div style="display: flex; justify-content: space-between; align-items: center; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.1em">
    <span>HOLE 214</span>
    <span style="color: #F2B632; font-weight: 700">SHOT 3 OF 5</span>
  </div>

  <div style="background: #F3EEDF; border-radius: 8px; padding: 6px; box-shadow: 0 5px 0 #0E2618; margin-top: 10px">
    <div style="border: 3px solid #1E4E8C; border-radius: 5px; padding: 18px 16px 0; text-align: center; color: #14201A; overflow: hidden">
      <p style="margin: 0; font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #4F554C">YOUR ANSWER</p>
      <h1 style="margin: 8px 0 0; font-size: 30px; font-weight: 800">San Antonio Spurs</h1>
      <p style="margin: 6px 0 0; font-size: 13px; color: #4F554C">NBA franchise with more than 4 championships</p>
      <div style="margin: 18px -16px 0; background: #1E4E8C; padding: 14px 0 16px">
        <div style="font-family: 'Graduate', serif; font-size: 44px; line-height: 1; color: #F3EEDF">ALL-STAR</div>
        <div style="margin-top: 8px; font-family: 'Graduate', serif; font-size: 22px; color: #F2B632">+85 YDS</div>
      </div>
    </div>
  </div>

  <div style="background: #123322; border: 2px solid #2C6644; border-radius: 6px; padding: 14px 12px 10px">
    <div style="display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700">
      <span><span style="opacity: 0.7">140 →</span> <span style="color: #F2B632">225 YDS</span></span>
      <span>275 TO PIN</span>
    </div>
    <svg viewBox="0 0 342 110" width="100%" role="img" aria-label="Animation: the ball flies 85 yards, from 140 to 225 of 500" style="margin-top: 8px">
      <rect x="0" y="74" width="342" height="22" rx="11" fill="#2C6644"></rect>
      <rect x="10" y="78" width="4" height="13" fill="#F3EEDF"></rect>
      <path d="M12 84 Q43.4 16 74.8 84" fill="none" stroke="#F3EEDF" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 5"></path>
      <path d="M74.8 84 Q87.35 46 99.9 84" fill="none" stroke="#F3EEDF" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 5"></path>
      <path class="bk-arc" pathLength="1" d="M99.9 84 Q126.6 8 153.3 84" fill="none" stroke="#F2B632" stroke-width="3"></path>
      <ellipse cx="153.3" cy="86" rx="7" ry="2.5" fill="#0E2618" fill-opacity="0.6"></ellipse>
      <circle r="6.5" fill="#F3EEDF" stroke="#0E2618" stroke-width="2">
        <animateMotion dur="2.6s" repeatCount="indefinite" path="M99.9 84 Q126.6 8 153.3 84" keyPoints="0;1;1" keyTimes="0;0.55;1" calcMode="linear"></animateMotion>
      </circle>
      <line x1="326" y1="42" x2="326" y2="84" stroke="#F3EEDF" stroke-width="2"></line>
      <polygon points="326,42 340,48 326,54" fill="#F2B632"></polygon>
      <ellipse cx="326" cy="84" rx="6" ry="2.5" fill="#0E2618"></ellipse>
      <text x="74.8" y="108" text-anchor="middle" font-family="Space Mono, monospace" font-size="11" fill="#F3EEDF" fill-opacity="0.75">100</text>
      <text x="137.6" y="108" text-anchor="middle" font-family="Space Mono, monospace" font-size="11" fill="#F3EEDF" fill-opacity="0.75">200</text>
      <text x="200.4" y="108" text-anchor="middle" font-family="Space Mono, monospace" font-size="11" fill="#F3EEDF" fill-opacity="0.75">300</text>
      <text x="263.2" y="108" text-anchor="middle" font-family="Space Mono, monospace" font-size="11" fill="#F3EEDF" fill-opacity="0.75">400</text>
    </svg>
  </div>

  <div style="flex: 1"></div>

  <a href="05-card.html" style="display: block; background: #F2B632; color: #14201A; text-decoration: none; text-align: center; font-family: 'Graduate', serif; font-size: 26px; padding: 14px; border: 3px solid #0E2618; border-radius: 6px; box-shadow: 0 6px 0 #0E2618">NEXT SHOT</a>
</div>
</body>
</html>
