<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ball Knower — Prompt (auto-correct) (mockup)</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&amp;family=Graduate&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2B632}a:hover{color:#FFD36B}
</style>
<style>body{display:flex;justify-content:center;background:#0E2618;min-height:100vh}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 24px 28px; display: flex; flex-direction: column; gap: 16px; background: repeating-linear-gradient(90deg, #1A4530 0 28px, #173D2A 28px 56px); color: #F3EEDF; font-family: 'Archivo', sans-serif">
  <div style="display: flex; justify-content: space-between; align-items: center; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.1em">
    <span>HOLE 214</span>
    <span style="color: #F2B632; font-weight: 700">SHOT 3 OF 5</span>
    <span style="background: #A8321F; color: #F3EEDF; font-size: 14px; font-weight: 700; padding: 5px 12px; border-radius: 999px; letter-spacing: 0.04em">0:31</span>
  </div>

  <div style="background: #123322; border: 2px solid #2C6644; border-radius: 6px; padding: 10px 12px 6px">
    <div style="display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700">
      <span style="color: #F2B632">140 YDS</span>
      <span>360 TO PIN</span>
    </div>
    <svg viewBox="0 0 342 102" width="100%" role="img" aria-label="Fairway: ball at 140 of 500 yards after two shots">
      <rect x="0" y="64" width="342" height="20" rx="10" fill="#2C6644"></rect>
      <line x1="74.8" y1="86" x2="74.8" y2="90" stroke="#F3EEDF" stroke-opacity="0.6"></line>
      <line x1="137.6" y1="86" x2="137.6" y2="90" stroke="#F3EEDF" stroke-opacity="0.6"></line>
      <line x1="200.4" y1="86" x2="200.4" y2="90" stroke="#F3EEDF" stroke-opacity="0.6"></line>
      <line x1="263.2" y1="86" x2="263.2" y2="90" stroke="#F3EEDF" stroke-opacity="0.6"></line>
      <text x="74.8" y="101" text-anchor="middle" font-family="Space Mono, monospace" font-size="11" fill="#F3EEDF" fill-opacity="0.75">100</text>
      <text x="137.6" y="101" text-anchor="middle" font-family="Space Mono, monospace" font-size="11" fill="#F3EEDF" fill-opacity="0.75">200</text>
      <text x="200.4" y="101" text-anchor="middle" font-family="Space Mono, monospace" font-size="11" fill="#F3EEDF" fill-opacity="0.75">300</text>
      <text x="263.2" y="101" text-anchor="middle" font-family="Space Mono, monospace" font-size="11" fill="#F3EEDF" fill-opacity="0.75">400</text>
      <rect x="10" y="68" width="4" height="12" fill="#F3EEDF"></rect>
      <path d="M12 74 Q43.4 10 74.8 74" fill="none" stroke="#F3EEDF" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 5"></path>
      <path d="M74.8 74 Q87.35 38 99.9 74" fill="none" stroke="#F3EEDF" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 5"></path>
      <circle cx="99.9" cy="74" r="6" fill="#F3EEDF" stroke="#0E2618" stroke-width="2"></circle>
      <line x1="326" y1="34" x2="326" y2="74" stroke="#F3EEDF" stroke-width="2"></line>
      <polygon points="326,34 340,40 326,46" fill="#F2B632"></polygon>
      <ellipse cx="326" cy="74" rx="6" ry="2.5" fill="#0E2618"></ellipse>
    </svg>
  </div>

  <div style="background: #F3EEDF; color: #14201A; border-radius: 6px; padding: 18px 18px 16px; box-shadow: 0 5px 0 #0E2618">
    <span style="display: inline-block; background: #14201A; color: #F2B632; font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; padding: 4px 8px; border-radius: 3px">NBA</span>
    <h1 style="margin: 12px 0 0; font-size: 25px; font-weight: 800; line-height: 1.18">Name an NBA franchise with more than 4 championships.</h1>
    <p style="margin: 10px 0 0; font-size: 13px; color: #4F554C">Relocated franchises count. Spelling is forgiving.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <label for="answer" style="font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.1em">YOUR ANSWER</label>
    <input id="answer" type="text" value="san antonio spur" autocomplete="off" style="width: 100%; box-sizing: border-box; height: 52px; padding: 0 14px; font-family: 'Archivo', sans-serif; font-size: 18px; font-weight: 600; background: #F3EEDF; color: #14201A; border: 3px solid #F2B632; border-radius: 6px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 2px dashed #F2B632; border-radius: 6px; background: #123322">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2B632" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
      <div>
        <div style="font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #F2B632">AUTO-CORRECT</div>
        <div style="font-size: 17px; font-weight: 800; margin-top: 2px">San Antonio Spurs</div>
      </div>
    </div>
    <p style="margin: 0; font-size: 13px; line-height: 1.4; opacity: 0.85">Swing submits the corrected name. Keep typing to change it.</p>
  </div>

  <div style="flex: 1"></div>

  <a href="04-shot-result.html" style="display: block; background: #F2B632; color: #14201A; text-decoration: none; text-align: center; font-family: 'Graduate', serif; font-size: 28px; padding: 14px; border: 3px solid #0E2618; border-radius: 6px; box-shadow: 0 6px 0 #0E2618">SWING</a>
</div>
</body>
</html>
