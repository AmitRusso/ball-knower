name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # First-load JS < 50 KB gzipped per page (CLAUDE.md, hard rule 5).
      - run: pnpm size

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Local D1 for `pnpm preview`; no Cloudflare account needed.
      - run: pnpm db:migrate && pnpm db:seed
      # Lighthouse runs over HTTP/2, like production: an HTTP/2 proxy (self-signed
      # cert) in front of `pnpm preview`. Over HTTP/1.1 its slow-4G model queues
      # requests on six connections and overstates LCP (D17).
      - name: Start preview behind an HTTP/2 proxy
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost"             -keyout /tmp/key.pem -out /tmp/cert.pem 2>/dev/null
          nohup pnpm preview > /tmp/preview.log 2>&1 &
          nohup node scripts/h2-proxy.ts /tmp/key.pem /tmp/cert.pem > /tmp/proxy.log 2>&1 &
          for i in $(seq 60); do curl -skf https://localhost:4443/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/preview.log /tmp/proxy.log; exit 1
      # LCP (1.5 s static pages, 2.5 s /play and /range) on Lighthouse's mobile profile, plus TBT, CLS and accessibility (lighthouserc.json).
      - run: pnpm dlx @lhci/cli@0.15.1 autorun
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/reports

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml pytest
      - run: python -m pytest -q
