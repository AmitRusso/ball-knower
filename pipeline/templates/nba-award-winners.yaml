id: nba-award-winners
league: NBA
pool: nba-players
text: "Name {{award.text}}."
short: "{{award.short}}"
note: "{{award.note}}"
params:
  award:
    - { qid: Q222047, text: "an NBA MVP", short: "NBA MVP", note: "Regular-season Most Valuable Player.", years: 71 }
    - { qid: Q739499, text: "an NBA Finals MVP", short: "Finals MVP", note: "Bill Russell NBA Finals MVP Award.", years: 58 }
changes: ["04-15..06-25"]
expect_events: "{{award.years}}"  # one award statement per season through 2025–26
query: |
  SELECT ?item ?event WHERE {
    ?item p:P166 ?event . ?event ps:P166 wd:{{award.qid}} .
  }
