id: olympics-host-countries
league: OLYMPICS
pool: countries
text: "Name a country that has hosted the {{games.name}}."
short: "{{games.short}} host"
note: "{{games.note}}"
params:
  games:
    - { qid: Q159821, name: "Summer Olympics", short: "Summer Games", note: "Summer Games already held, by the host city's present-day country." }
    - { qid: Q82414, name: "Winter Olympics", short: "Winter Games", note: "Winter Games already held, by the host city's present-day country." }
needs_review_definition: true  # Moscow 1980 counts for Russia, Sarajevo 1984 for Bosnia
query: |
  SELECT DISTINCT ?item ?event WHERE {
    ?event wdt:P31|wdt:P179|wdt:P3450 wd:{{games.qid}} .
    ?event wdt:P276 ?city . ?city wdt:P17 ?item .
    { ?event wdt:P580 ?start } UNION { ?event wdt:P585 ?start }
    FILTER(?start <= NOW())
  }
